services:
  redis:
    image: redis:8-alpine
    container_name: quato-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --loglevel warning
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: quato-minio
    ports:
      - "9000:9000"   # S3 API — used by the app and boto3
      - "9001:9001"   # MinIO web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: quato-frontend-build
    volumes:
      - frontend_dist:/dist

  quato-backend:
    build: .
    container_name: quato-backend
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: quato-caddy
    ports:
      - "8443:8443"
      - "9443:9443"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - frontend_dist:/srv/frontend
      - caddy_data:/data
    depends_on:
      - frontend-build
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  caddy_data:
  frontend_dist:
