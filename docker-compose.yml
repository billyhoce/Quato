services:
  redis:
    image: redis:8-alpine
    container_name: quato-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --loglevel warning
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: quato-minio
    ports:
      - "9000:9000"   # S3 API — used by the app and boto3
      - "9001:9001"   # MinIO web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped

  quato-backend:
    build: .
    container_name: quato-backend
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: quato-caddy
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv/frontend
      - caddy_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  caddy_data:
