services:
  redis:
    image: redis:8-alpine
    container_name: quato-redis
    command: redis-server --save "" --loglevel warning
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: quato-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped

  quato-backend:
    build: .
    container_name: quato-backend
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - minio
    ports:
      - "8000:8000"
    restart: unless-stopped

  quato-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend.dev
    container_name: quato-frontend
    environment:
      BACKEND_URL: http://quato-backend:8000
    depends_on:
      - quato-backend
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  minio_data:
